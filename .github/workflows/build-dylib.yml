name: build neutralizer dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Regenerate stubs (spec consistency check)
        run: |
          python3 tools/gen_stubs.py
          git diff --exit-code -- \
            neutralizer/neutralizer_stubs.c \
            neutralizer/exports.txt \
            neutralizer/symbol_spec.txt

      - name: Build single-dylib neutralizer
        run: bash neutralizer/build.sh

      - name: Verify artifact
        run: |
          echo "--- install name ---"
          otool -D neutralizer/build/neutralizer.dylib
          echo "--- linked frameworks (Foundation/Security expected) ---"
          otool -L neutralizer/build/neutralizer.dylib
          echo "--- neutralized stub export count (expect 254) ---"
          nm -gU neutralizer/build/neutralizer.dylib | grep -cE '_(Keychain|KCPipeline|IdnWebCore|Bitpie|bitpie_|vn_keychain|vn_copyfile|vn_try_copy_keychain|MCMFilza|sbx_mirror_keychain|sbx_ro2_keychain|sbx_try_keychain)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neutralizer-dylib
          if-no-files-found: error
          path: neutralizer/build/neutralizer.dylib
